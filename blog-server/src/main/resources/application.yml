spring:
  application.name: blog-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog}
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
mybatis.configuration.map-underscore-to-camel-case: true
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
app:
  jwt.secret: ${JWT_SECRET:development-only-secret-change-before-production-32bytes}
  jwt.expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  admin.username: ${ADMIN_USERNAME:admin}
  admin.password: ${ADMIN_PASSWORD:admin123}